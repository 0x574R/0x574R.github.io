# RAZOR - Security Blog (English build)
# Build command: mkdocs build -f mkdocs_en.yml
# Output: site/en/ (served at /en/ on GitHub Pages)

site_name: RAZOR
site_url: https://0x574r.github.io/en/
site_description: Offensive security blog

docs_dir: docs_en
site_dir: site/en

repo_name: 0x574R
repo_url: https://github.com/0x574R

copyright: "© 2026 0x574R"

theme:
  name: material
  custom_dir: overrides
  language: en
  logo: assets/logo.png
  favicon: assets/favicon.png

  palette:
    - scheme: default
      primary: blue grey
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: blue grey
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

  font:
    text: IBM Plex Sans
    code: JetBrains Mono

  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy

  icon:
    repo: fontawesome/brands/github
    admonition:
      note: fontawesome/solid/note-sticky
      tip: fontawesome/solid/lightbulb
      warning: fontawesome/solid/triangle-exclamation
      danger: fontawesome/solid/skull-crossbones
      info: fontawesome/solid/circle-info
      abstract: fontawesome/solid/book
      example: fontawesome/solid/flask
      quote: fontawesome/solid/quote-left

plugins:
  - search

extra_css:
  - stylesheets/custom.css

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - tables
  - attr_list
  - md_in_html
  - md_in_html
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.mark
  - pymdownx.critic
  - pymdownx.keys

nav:
  - Malware Dev:
      - Fileless Loader: research/malware-dev/fileless-loader.md
      - Reverse TCP Shell: research/malware-dev/reverse-shell.md
      - Process Injection via Ptrace: research/malware-dev/ptrace-injection.md
      - "DARKCLOAK: Novel Flow for Process Masquerading": research/malware-dev/darkcloak.md
  - Kernel Theory:
      - ELF Internals: research/kernel-theory/elf-internals.md
      - Identity and Privileges of a Process: research/kernel-theory/identity-model.md
      - Process Identity Spoofing: research/kernel-theory/process-identity.md
