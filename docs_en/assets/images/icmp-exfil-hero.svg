<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="bg-icmp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#08080c"/>
      <stop offset="100%" style="stop-color:#0a0f1e"/>
    </linearGradient>
    <filter id="glow-icmp">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-icmp-strong">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="600" height="200" fill="url(#bg-icmp)"/>

  <!-- Victim host (left) -->
  <g transform="translate(30, 30)">
    <rect x="0" y="0" width="140" height="140" rx="6" fill="#0d0618" stroke="#ff5555" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="70" y="16" fill="#ff5555" font-family="monospace" font-size="7" text-anchor="middle">VICTIM</text>
    <!-- File icon -->
    <rect x="20" y="28" width="100" height="22" rx="3" fill="#1a0a2e" stroke="#ff5555" stroke-width="0.6"/>
    <text x="70" y="42" fill="#ff5555" font-family="monospace" font-size="7" text-anchor="middle">/var/www/app.db</text>
    <!-- Fragmentation -->
    <g transform="translate(15, 60)">
      <rect x="0" y="0" width="24" height="14" rx="2" fill="#1a0a2e" stroke="#bd93f9" stroke-width="0.5"/>
      <text x="12" y="10" fill="#bd93f9" font-family="monospace" font-size="5" text-anchor="middle">BLK1</text>
      <rect x="28" y="0" width="24" height="14" rx="2" fill="#1a0a2e" stroke="#bd93f9" stroke-width="0.5"/>
      <text x="40" y="10" fill="#bd93f9" font-family="monospace" font-size="5" text-anchor="middle">BLK2</text>
      <rect x="56" y="0" width="24" height="14" rx="2" fill="#1a0a2e" stroke="#bd93f9" stroke-width="0.5"/>
      <text x="68" y="10" fill="#bd93f9" font-family="monospace" font-size="5" text-anchor="middle">BLK3</text>
      <rect x="84" y="0" width="24" height="14" rx="2" fill="#1a0a2e" stroke="#bd93f9" stroke-width="0.5"/>
      <text x="96" y="10" fill="#bd93f9" font-family="monospace" font-size="5" text-anchor="middle">BLK n</text>
    </g>
    <!-- NASM label -->
    <rect x="20" y="86" width="100" height="18" rx="3" fill="#0a1628" stroke="#8be9fd" stroke-width="0.6"/>
    <text x="70" y="98" fill="#8be9fd" font-family="monospace" font-size="6.5" text-anchor="middle">ping.asm (NASM)</text>
    <!-- Socket info -->
    <text x="70" y="122" fill="#6272a4" font-family="monospace" font-size="5.5" text-anchor="middle">SOCK_DGRAM · IPPROTO_ICMP</text>
    <text x="70" y="134" fill="#6272a4" font-family="monospace" font-size="5.5" text-anchor="middle">No CAP_NET_RAW</text>
  </g>

  <!-- ICMP packets flying across (center) -->
  <g transform="translate(185, 40)">
    <!-- Packet 1 -->
    <g>
      <rect x="0" y="0" width="220" height="20" rx="3" fill="#0d0618" stroke="#50fa7b" stroke-width="0.8">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="2.5s" begin="0s" repeatCount="indefinite"/>
      </rect>
      <text x="8" y="13" fill="#ff79c6" font-family="monospace" font-size="6">Type:8</text>
      <text x="48" y="13" fill="#ffb86c" font-family="monospace" font-size="6">Code:0</text>
      <text x="88" y="13" fill="#8be9fd" font-family="monospace" font-size="6">Seq:1</text>
      <rect x="125" y="3" width="88" height="14" rx="2" fill="#0f2a0f" stroke="#50fa7b" stroke-width="0.5"/>
      <text x="169" y="13" fill="#50fa7b" font-family="monospace" font-size="6" text-anchor="middle">Data: de ad be ef</text>
    </g>
    <!-- Packet 2 -->
    <g transform="translate(10, 28)">
      <rect x="0" y="0" width="220" height="20" rx="3" fill="#0d0618" stroke="#50fa7b" stroke-width="0.8">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="2.5s" begin="0.5s" repeatCount="indefinite"/>
      </rect>
      <text x="8" y="13" fill="#ff79c6" font-family="monospace" font-size="6">Type:8</text>
      <text x="48" y="13" fill="#ffb86c" font-family="monospace" font-size="6">Code:0</text>
      <text x="88" y="13" fill="#8be9fd" font-family="monospace" font-size="6">Seq:2</text>
      <rect x="125" y="3" width="88" height="14" rx="2" fill="#0f2a0f" stroke="#50fa7b" stroke-width="0.5"/>
      <text x="169" y="13" fill="#50fa7b" font-family="monospace" font-size="6" text-anchor="middle">Data: ca fe ba be</text>
    </g>
    <!-- Packet 3 -->
    <g transform="translate(20, 56)">
      <rect x="0" y="0" width="220" height="20" rx="3" fill="#0d0618" stroke="#50fa7b" stroke-width="0.8">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="2.5s" begin="1s" repeatCount="indefinite"/>
      </rect>
      <text x="8" y="13" fill="#ff79c6" font-family="monospace" font-size="6">Type:8</text>
      <text x="48" y="13" fill="#ffb86c" font-family="monospace" font-size="6">Code:0</text>
      <text x="88" y="13" fill="#8be9fd" font-family="monospace" font-size="6">Seq:n</text>
      <rect x="125" y="3" width="88" height="14" rx="2" fill="#0f2a0f" stroke="#50fa7b" stroke-width="0.5"/>
      <text x="169" y="13" fill="#50fa7b" font-family="monospace" font-size="6" text-anchor="middle">Data: .. .. .. ..</text>
    </g>
    <!-- Direction arrows -->
    <g transform="translate(60, 88)">
      <line x1="0" y1="8" x2="100" y2="8" stroke="#50fa7b" stroke-width="1.2">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="1.5s" repeatCount="indefinite"/>
      </line>
      <polygon points="100,8 92,3 92,13" fill="#50fa7b">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="1.5s" repeatCount="indefinite"/>
      </polygon>
      <text x="50" y="4" fill="#50fa7b" font-family="monospace" font-size="6" text-anchor="middle" filter="url(#glow-icmp)">ICMP Echo Request</text>
    </g>
    <!-- ICMP label -->
    <text x="110" y="120" fill="#6272a4" font-family="monospace" font-size="5.5" text-anchor="middle">MTU 1500 → max 1472 B/pkt</text>
  </g>

  <!-- Attacker host (right) -->
  <g transform="translate(430, 30)">
    <rect x="0" y="0" width="140" height="140" rx="6" fill="#0d0618" stroke="#50fa7b" stroke-width="1.5">
      <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="2.5s" repeatCount="indefinite"/>
    </rect>
    <text x="70" y="16" fill="#50fa7b" font-family="monospace" font-size="7" text-anchor="middle" filter="url(#glow-icmp)">ATTACKER</text>
    <!-- Receiver -->
    <rect x="15" y="28" width="110" height="18" rx="3" fill="#0a1628" stroke="#50fa7b" stroke-width="0.6"/>
    <text x="70" y="40" fill="#50fa7b" font-family="monospace" font-size="6.5" text-anchor="middle">pong.py (SOCK_RAW)</text>
    <!-- Reassembly -->
    <g transform="translate(15, 54)">
      <rect x="0" y="0" width="110" height="42" rx="3" fill="#0a1628" stroke="#bd93f9" stroke-width="0.5"/>
      <text x="55" y="12" fill="#bd93f9" font-family="monospace" font-size="5.5" text-anchor="middle">Reassembly</text>
      <text x="55" y="23" fill="#8be9fd" font-family="monospace" font-size="5" text-anchor="middle">seq[1] → de ad be ef</text>
      <text x="55" y="32" fill="#8be9fd" font-family="monospace" font-size="5" text-anchor="middle">seq[2] → ca fe ba be</text>
      <text x="55" y="41" fill="#6272a4" font-family="monospace" font-size="5" text-anchor="middle">seq[n] → .. .. .. ..</text>
    </g>
    <!-- Reconstructed file -->
    <rect x="15" y="104" width="110" height="22" rx="3" fill="#0f2a0f" stroke="#50fa7b" stroke-width="0.6">
      <animate attributeName="stroke-opacity" values="0.3;0.9;0.3" dur="2s" repeatCount="indefinite"/>
    </rect>
    <text x="70" y="118" fill="#50fa7b" font-family="monospace" font-size="7" text-anchor="middle" filter="url(#glow-icmp)">app.db ✓</text>
  </g>

  <!-- Bottom labels -->
  <text x="100" y="190" fill="#44475a" font-family="monospace" font-size="6" text-anchor="middle">Firewall: TCP/UDP ✗  ICMP ✓</text>
  <text x="500" y="190" fill="#44475a" font-family="monospace" font-size="6" text-anchor="middle">md5sum match</text>
</svg>
