<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 627" width="1200" height="627">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff5555"/>
      <stop offset="50%" stop-color="#bd93f9"/>
      <stop offset="100%" stop-color="#50fa7b"/>
    </linearGradient>
    <linearGradient id="packetGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8be9fd" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#bd93f9" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="627" fill="url(#bg)"/>

  <!-- Grid pattern -->
  <g opacity="0.04" stroke="#8be9fd" stroke-width="0.5">
    <line x1="0" y1="0" x2="0" y2="627"/><line x1="40" y1="0" x2="40" y2="627"/>
    <line x1="80" y1="0" x2="80" y2="627"/><line x1="120" y1="0" x2="120" y2="627"/>
    <line x1="160" y1="0" x2="160" y2="627"/><line x1="200" y1="0" x2="200" y2="627"/>
    <line x1="240" y1="0" x2="240" y2="627"/><line x1="280" y1="0" x2="280" y2="627"/>
    <line x1="320" y1="0" x2="320" y2="627"/><line x1="360" y1="0" x2="360" y2="627"/>
    <line x1="400" y1="0" x2="400" y2="627"/><line x1="440" y1="0" x2="440" y2="627"/>
    <line x1="480" y1="0" x2="480" y2="627"/><line x1="520" y1="0" x2="520" y2="627"/>
    <line x1="560" y1="0" x2="560" y2="627"/><line x1="600" y1="0" x2="600" y2="627"/>
    <line x1="640" y1="0" x2="640" y2="627"/><line x1="680" y1="0" x2="680" y2="627"/>
    <line x1="720" y1="0" x2="720" y2="627"/><line x1="760" y1="0" x2="760" y2="627"/>
    <line x1="800" y1="0" x2="800" y2="627"/><line x1="840" y1="0" x2="840" y2="627"/>
    <line x1="880" y1="0" x2="880" y2="627"/><line x1="920" y1="0" x2="920" y2="627"/>
    <line x1="960" y1="0" x2="960" y2="627"/><line x1="1000" y1="0" x2="1000" y2="627"/>
    <line x1="1040" y1="0" x2="1040" y2="627"/><line x1="1080" y1="0" x2="1080" y2="627"/>
    <line x1="1120" y1="0" x2="1120" y2="627"/><line x1="1160" y1="0" x2="1160" y2="627"/>
    <line x1="0" y1="40" x2="1200" y2="40"/><line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="120" x2="1200" y2="120"/><line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="200" x2="1200" y2="200"/><line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="280" x2="1200" y2="280"/><line x1="0" y1="320" x2="1200" y2="320"/>
    <line x1="0" y1="360" x2="1200" y2="360"/><line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="440" x2="1200" y2="440"/><line x1="0" y1="480" x2="1200" y2="480"/>
    <line x1="0" y1="520" x2="1200" y2="520"/><line x1="0" y1="560" x2="1200" y2="560"/>
    <line x1="0" y1="600" x2="1200" y2="600"/>
  </g>

  <!-- Accent line top -->
  <rect x="0" y="0" width="1200" height="3" fill="url(#accent)"/>

  <!-- ICMP packet visualization (left side) -->
  <g transform="translate(80, 160)" filter="url(#glow)">
    <!-- Victim host -->
    <rect x="0" y="80" width="120" height="50" rx="4" fill="none" stroke="#ff5555" stroke-width="1.5" opacity="0.7"/>
    <text x="60" y="110" text-anchor="middle" fill="#ff5555" font-family="monospace" font-size="13" font-weight="bold">VICTIM</text>

    <!-- Packet stream -->
    <g opacity="0.9">
      <!-- Packet 1 -->
      <rect x="155" y="60" width="90" height="30" rx="3" fill="none" stroke="url(#packetGlow)" stroke-width="1"/>
      <text x="170" y="78" fill="#8be9fd" font-family="monospace" font-size="9">08 00 00 00</text>
      <text x="170" y="88" fill="#ffb86c" font-family="monospace" font-size="8">seq:0001</text>

      <!-- Packet 2 -->
      <rect x="270" y="85" width="90" height="30" rx="3" fill="none" stroke="url(#packetGlow)" stroke-width="1"/>
      <text x="285" y="103" fill="#8be9fd" font-family="monospace" font-size="9">08 00 00 00</text>
      <text x="285" y="113" fill="#ffb86c" font-family="monospace" font-size="8">seq:0002</text>

      <!-- Packet 3 -->
      <rect x="385" y="110" width="90" height="30" rx="3" fill="none" stroke="url(#packetGlow)" stroke-width="1"/>
      <text x="400" y="128" fill="#8be9fd" font-family="monospace" font-size="9">08 00 00 00</text>
      <text x="400" y="138" fill="#ffb86c" font-family="monospace" font-size="8">seq:0003</text>

      <!-- Arrows -->
      <line x1="145" y1="95" x2="155" y2="80" stroke="#8be9fd" stroke-width="1" opacity="0.5"/>
      <line x1="260" y1="80" x2="270" y2="95" stroke="#8be9fd" stroke-width="1" opacity="0.5"/>
      <line x1="375" y1="105" x2="385" y2="120" stroke="#8be9fd" stroke-width="1" opacity="0.5"/>
    </g>

    <!-- Data fragments floating -->
    <text x="180" y="50" fill="#50fa7b" font-family="monospace" font-size="10" opacity="0.6">de ad be ef</text>
    <text x="300" y="75" fill="#50fa7b" font-family="monospace" font-size="10" opacity="0.6">ca fe ba be</text>
    <text x="410" y="100" fill="#50fa7b" font-family="monospace" font-size="10" opacity="0.6">13 37 00 ff</text>

    <!-- Attacker host -->
    <rect x="500" y="120" width="120" height="50" rx="4" fill="none" stroke="#50fa7b" stroke-width="1.5" opacity="0.7"/>
    <text x="560" y="150" text-anchor="middle" fill="#50fa7b" font-family="monospace" font-size="13" font-weight="bold">ATTACKER</text>

    <!-- Reassembled file icon -->
    <rect x="530" y="185" width="60" height="45" rx="2" fill="none" stroke="#50fa7b" stroke-width="1" opacity="0.4"/>
    <text x="560" y="205" text-anchor="middle" fill="#50fa7b" font-family="monospace" font-size="9" opacity="0.6">app.db</text>
    <text x="560" y="220" text-anchor="middle" fill="#50fa7b" font-family="monospace" font-size="8" opacity="0.4">reassembled</text>
  </g>

  <!-- ICMP Header diagram -->
  <g transform="translate(80, 430)" opacity="0.15">
    <text x="0" y="0" fill="#8be9fd" font-family="monospace" font-size="11">+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+</text>
    <text x="0" y="16" fill="#8be9fd" font-family="monospace" font-size="11">|     Type      |     Code      |           Checksum            |</text>
    <text x="0" y="32" fill="#8be9fd" font-family="monospace" font-size="11">+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+</text>
    <text x="0" y="48" fill="#8be9fd" font-family="monospace" font-size="11">|          Identifier           |        Sequence Number        |</text>
    <text x="0" y="64" fill="#8be9fd" font-family="monospace" font-size="11">+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+-+</text>
  </g>

  <!-- Main text -->
  <text x="750" y="200" text-anchor="middle" fill="#e6edf3" font-family="'Segoe UI', Arial, sans-serif" font-size="19" font-weight="300" letter-spacing="6">R A Z O R</text>

  <text x="750" y="270" text-anchor="middle" fill="#f0f6fc" font-family="'Segoe UI', Arial, sans-serif" font-size="36" font-weight="700">Data Exfiltration</text>
  <text x="750" y="315" text-anchor="middle" fill="#f0f6fc" font-family="'Segoe UI', Arial, sans-serif" font-size="36" font-weight="700">via ICMP Echo Request</text>

  <!-- Subtitle -->
  <text x="750" y="365" text-anchor="middle" fill="#8b949e" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="400">Covert data exfiltration using ICMP protocol</text>

  <!-- Tags -->
  <g transform="translate(750, 410)">
    <rect x="-155" y="-15" width="90" height="28" rx="14" fill="none" stroke="#bd93f9" stroke-width="1" opacity="0.6"/>
    <text x="-110" y="5" text-anchor="middle" fill="#bd93f9" font-family="'Segoe UI', Arial, sans-serif" font-size="12">Assembly</text>

    <rect x="-45" y="-15" width="90" height="28" rx="14" fill="none" stroke="#8be9fd" stroke-width="1" opacity="0.6"/>
    <text x="0" y="5" text-anchor="middle" fill="#8be9fd" font-family="'Segoe UI', Arial, sans-serif" font-size="12">x86-64</text>

    <rect x="65" y="-15" width="90" height="28" rx="14" fill="none" stroke="#ffb86c" stroke-width="1" opacity="0.6"/>
    <text x="110" y="5" text-anchor="middle" fill="#ffb86c" font-family="'Segoe UI', Arial, sans-serif" font-size="12">Linux</text>
  </g>

  <!-- MITRE reference -->
  <text x="750" y="470" text-anchor="middle" fill="#484f58" font-family="monospace" font-size="11">T1095 // T1048</text>

  <!-- Blog URL -->
  <text x="750" y="560" text-anchor="middle" fill="#484f58" font-family="'Segoe UI', Arial, sans-serif" font-size="14">0x574r.github.io</text>

  <!-- Bottom accent line -->
  <rect x="0" y="624" width="1200" height="3" fill="url(#accent)"/>
</svg>
