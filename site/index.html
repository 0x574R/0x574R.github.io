<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>RAZOR</title>
  <script>
    var l = (navigator.language || 'en').toLowerCase();
    window.location.replace(l.startsWith('es') ? '/es/' : '/en/');
  </script>
  <noscript><meta http-equiv="refresh" content="0;url=/en/"></noscript>
</head>
<body><p>Redirecting — <a href="/es/">Español</a> · <a href="/en/">English</a></p></body>
</html>
